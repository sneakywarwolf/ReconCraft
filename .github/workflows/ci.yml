name: CI

on:
  push:
    branches: [master, "features-and-fixes"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Only what the headless/MCP layer and tests need. The PyQt GUI is not
        # exercised in CI, so PyQt5/PySide6 are intentionally not installed.
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Byte-compile (syntax check) all sources
        run: python -m compileall -q core mcp_server plugins reconcraft_cli.py

      - name: Run headless test suite
        run: python -m pytest tests/ -q
